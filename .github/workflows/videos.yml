name: Refresh videos
on:
  schedule:
        - cron: "23 23 * * *"
        - cron: "23 0-5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build videos
        continue-on-error: true
        run: node scripts/videos.js
      - name: Save results
        if: always()
        run: |
          git config user.name "fixturio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update videos" || echo "No changes"
          git pull --rebase origin main || true
          git push
