name: Daily picks
on:
  schedule:
        - cron: "30 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Save match lists
        if: github.event.schedule != '23 6-22 * * *'
        continue-on-error: true
        run: node scripts/matches.js -1,0,1
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Refresh today's matches
        run: node scripts/matches.js 0
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Live-score alerts
        continue-on-error: true
        run: |
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            cd scripts && npm install --silent && cd .. && node scripts/live-alerts.js
          else
            node scripts/live-alerts.js
          fi
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Check yesterday's picks
        if: github.event.schedule != '23 6-22 * * *'
        run: node scripts/results.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Build standings and news
        if: github.event.schedule != '23 6-22 * * *'
        continue-on-error: true
        run: |
          node scripts/standings.js
          node scripts/news.js
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Build videos
        continue-on-error: true
        run: node scripts/videos.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Predict every match
        if: github.event.schedule != '23 6-22 * * *'
        continue-on-error: true
        run: node scripts/all.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Build today's picks
        if: github.event.schedule != '23 6-22 * * *'
        run: node scripts/daily.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Build basketball picks
        if: github.event.schedule != '23 6-22 * * *'
        continue-on-error: true
        run: node scripts/basketball.js
        env:
          BASKETBALL_KEY: ${{ secrets.BASKETBALL_KEY }}
      - name: Save results
        if: always()
        run: |
          git config user.name "fixturio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update daily picks" || echo "No changes"
          git pull --rebase origin main || true
          git push
