name: Daily picks
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check yesterday's picks
        run: node scripts/results.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Build today's picks
        run: node scripts/daily.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Save results
        if: always()
        run: |
          git config user.name "fixturio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update daily picks" || echo "No changes"
          git push
