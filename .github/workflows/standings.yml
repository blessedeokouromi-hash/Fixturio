name: Standings rebuild
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build standings
        run: node scripts/standings.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Save results
        run: |
          git config user.name "fixturio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add standings.json scorers.json
          git commit -m "Rebuild standings" || echo "No changes"
          git pull --rebase origin main || true
          git push
