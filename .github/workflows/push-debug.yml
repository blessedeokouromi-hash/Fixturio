name: Push debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check VAPID pair
        run: node -e "
          const b64u = s => Buffer.from(String(s).replace(/-/g,'+').replace(/_/g,'/'), 'base64');
          const crypto = require('crypto');
          const priv = b64u(process.env.VAPID_PRIVATE_KEY);
          console.log('priv bytes:', priv.length);
          const ecdh = crypto.createECDH('prime256v1');
          ecdh.setPrivateKey(priv);
          const pub = ecdh.getPublicKey('base64url');
          console.log('derived pub:', pub);
          console.log('expected pub:', process.env.VAPID_PUBLIC_KEY);
          console.log('expected bytes:', b64u(process.env.VAPID_PUBLIC_KEY).length);
          console.log('MATCH:', pub === String(process.env.VAPID_PUBLIC_KEY).replace(/=*$/,''));
        "
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
