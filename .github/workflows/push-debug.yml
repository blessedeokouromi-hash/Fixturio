name: Push debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify key pair
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          cat > /tmp/check.js <<'EOF'
          const crypto = require("crypto");
          const fs = require("fs");
          const b64u = (s) => Buffer.from(String(s).replace(/-/g, "+").replace(/_/g, "/"), "base64");
          const src = fs.readFileSync("scripts/push-send.js", "utf8");
          const m = src.match(/"([A-Za-z0-9_-]{80,120})"/);
          const pub = m && m[1];
          const ecdh = crypto.createECDH("prime256v1");
          ecdh.setPrivateKey(b64u(process.env.VAPID_PRIVATE_KEY));
          console.log("signing pub (from secret):", ecdh.getPublicKey("base64url"));
          console.log("browser pub (in code):    ", pub);
          console.log("PAIR MATCH:", ecdh.getPublicKey("base64url") === pub);
          if (ecdh.getPublicKey("base64url") !== pub) process.exit(1);
          EOF
          node /tmp/check.js
      - name: Test one push
        run: cd scripts && npm install --silent && cd .. && node scripts/push-send.js --test
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
