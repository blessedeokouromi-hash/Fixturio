name: Basketball picks
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build basketball picks
        continue-on-error: true
        run: node scripts/basketball.js
        env:
          BASKETBALL_KEY: ${{ secrets.BASKETBALL_KEY }}
      - name: Save basketball data
        if: always()
        run: |
          git config user.name "fixturio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Basketball picks update" || echo "No changes"
          git pull --rebase origin main || true
          git push
