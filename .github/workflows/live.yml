name: Live scores
on:
  schedule:
    - cron: "*/30 11-23 * * *"
    - cron: "0 0-2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh today's matches
        run: node scripts/matches.js 0
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Save
        run: |
          git config user.name "fixturio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "Update scores" || echo "No changes"
          git pull --rebase origin main || true
          git push
