<!DOCTYPE html>
<html lang="en"><head><script src="https://quge5.com/88/tag.min.js" data-zone="313892" async data-cfasync="false"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5A3C">
<meta name="robots" content="noindex">
<title>Match | Fixturio</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:500 15px/1.4 var(--f);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:4;background:var(--pitch);border-bottom:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:32px;height:32px;flex:none}
.logo b{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em}
.top>a{color:var(--hmu);text-decoration:none;font-weight:700}
.tabs{display:flex;align-items:center;gap:22px;padding:0 16px;background:var(--pitch);border-bottom:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:11px 0;color:var(--hmu);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--amb)}

.tabs span{margin-left:auto;font-size:12px;color:var(--hmu)}
.hero{margin:16px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.lg2{text-align:center;font-size:13px;color:var(--mu)}
.trow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px}
.t{text-align:center;min-width:0}
.t img{width:52px;height:52px;object-fit:contain}
.t b{display:block;font-size:15px;font-weight:800;margin-top:6px;word-wrap:break-word}
.score{font-size:34px;font-weight:800;letter-spacing:-.02em;text-align:center;min-width:70px}
.score small{display:block;font-size:13px;font-weight:700;color:var(--mu)}
.score.live small{color:var(--live)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.acts button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.acts button.on{background:var(--amb);border-color:var(--amb);color:var(--ink)}
.card{margin:12px 16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.pred{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.pred .sc2{font-size:30px;font-weight:800;color:var(--amb)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;margin-top:9px}
.mrow .nm{font-weight:600}
.mrow .pv{font-weight:800}
.tr{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--mu);border-radius:3px}
.note{margin:12px 0 0;font-size:13px;color:var(--mu)}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ev:first-of-type{border-top:0}
.ev .m2{font-weight:700;color:var(--mu);text-align:right}
.st2{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.st2 .l,.st2 .r{font-weight:700;text-align:center}
.st2 .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.st2 .bar i{display:block;height:100%}
.st2 .bar .lft{background:var(--amb);border-radius:3px 0 0 3px}
.st2 .bar .rgt{background:#7FB3E8;border-radius:0 3px 3px 0}
.st2 .lbl{text-align:center;font-size:12px;color:var(--mu);margin-top:2px}
.xi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.xi>div{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px}
.xi b{display:block;font-size:13px;font-weight:800;margin-bottom:4px}
.xi ul{margin:0;padding:0 0 0 16px;font-size:13px;color:var(--mu);max-height:190px;overflow-y:auto}
.fine{margin:16px 16px 0;font-size:12px;color:var(--mu)}
.adslot{min-height:60px;margin:12px 16px;display:flex;justify-content:center;align-items:center}
.adslot:empty{display:none}
.msg{margin:24px 16px;color:var(--mu)}

.f5m{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.f5m .lb{font-size:11px;color:var(--mu);font-weight:600}
.f5m .fvs{color:var(--mu)}
.fb{font-style:normal;display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font-size:10px;font-weight:800;color:#fff}
.fb.w{background:#2E7D32}.fb.d{background:#A87B00}.fb.l{background:#C0392B}
</style><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"></head><body>
<div class="wrap">
<header class="top"><a class="logo" href="/"><img src="/logo.png" alt="Fixturio logo" style="width:32px;height:32px;flex:none;border-radius:8px"><b>Fixturio</b></a><a href="/">All matches</a></header>
<nav class="tabs tabsx"><a href="/">Matches</a><a href="/picks.html">Top 15</a><a href="/standings.html">Standings</a><a href="/news.html">News</a><a href="/video.html">Video</a><a href="/saved.html">Saved</a><a href="/tools.html">Tools</a><span id="upd"></span></nav>
<main id="app"><p class="msg">Loading match…</p></main>
<div class="bet-cta" data-banner="1"></div><p class="fine">18+ only. Predictions are estimates, not guarantees.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LIVE=["1H","2H","HT","ET","BT","P","LIVE"],DONE=["FT","AET","PEN"];
const mid=new URLSearchParams(location.search).get("id").replace(/\D/g,"");
let m=null,p=null,info=null;

function star(){
  let s=[];try{s=JSON.parse(localStorage.getItem("fixturio:saved")||"[]")}catch(e){}
  const i=s.indexOf(+mid);
  if(i>=0)s.splice(i,1);else s.unshift(+mid);
  localStorage.setItem("fixturio:saved",JSON.stringify(s.slice(0,60)));
  const b=$("sv");if(b){b.classList.toggle("on",i<0);b.textContent=i<0?"★ Saved":"☆ Save match";}
}
function tm(t){return new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});}
function stTxt(){const s=m.fixture.status.short;if(s==="HT")return "Half time";if(LIVE.includes(s))return (m.fixture.status.elapsed||"")+"′ live";if(s==="NS")return "Kick-off "+tm(m.fixture.date);if(s==="FT")return "Full time";return s;}

function render(){
  if(!m){$("app").innerHTML='<p class="msg">This match is not in our coverage for today or the neighbouring days.</p>';return;}
  const h=m.teams.home,a=m.teams.away,pred=p?p[mid]:null;
  document.title=h.name+" vs "+a.name+" | Fixturio";
  let html='<div class="hero"><div class="lg2">'+esc(m.league.name)+" · "+esc(m.league.country)+" · "+tm(m.fixture.date)+'</div>';
  html+='<div class="trow"><div class="t">'+(h.logo?'<img src="'+esc(h.logo)+'" alt="">':"")+"<b>"+esc(h.name)+"</b></div>";
  html+='<div class="score'+(LIVE.includes(m.fixture.status.short)?" live":"")+'">'+(m.goals.home===null?"v":m.goals.home+" – "+m.goals.away)+"<small>"+esc(stTxt())+"</small></div>";
  html+='<div class="t">'+(a.logo?'<img src="'+esc(a.logo)+'" alt="">':"")+"<b>"+esc(a.name)+"</b></div></div>";
  if(pred&&pred.form&&(pred.form.h||pred.form.a)){
    const fch=v=>String(v||"").split(" ").filter(Boolean).slice(-5).map(c=>'<i class="fb '+c.toLowerCase()+'">'+c+'</i>').join("");
    html+='<div class="f5m"><span class="lb">'+esc(h.name.split(" ")[0])+'</span>'+fch(pred.form.h)+'<span class="fvs">·</span>'+fch(pred.form.a)+'<span class="lb">'+esc(a.name.split(" ")[0])+'</span></div>';
  }
  html+='<div class="acts"><button id="sv" onclick="star()">☆ Save match</button><button id="evb" onclick="loadEvents()">Load events &amp; stats</button><button onclick="share()">Share</button></div></div>';
  if(pred){
    const mx=Math.max(pred.h,pred.d,pred.a);
    html+='<div class="card"><h3>Model prediction</h3><div class="pred"><span class="sc2">'+esc(pred.s)+'</span><div>Predicted score<br><small style="color:var(--mu)">Top chance '+mx+'% · Expected goals '+pred.x+" – "+pred.y+"</small></div></div>";
    const rows=[["Match result",[[h.name+" win",pred.h],["Draw",pred.d],[a.name+" win",pred.a]]],["Total goals",[["Over 2.5",pred.o],["Under 2.5",100-pred.o]]],["Both teams to score",[["Yes",pred.b],["No",100-pred.b]]]];
    rows.forEach(r=>{html+='<div class="note" style="margin-top:12px">'+esc(r[0])+"</div>";r[1].forEach(x=>{html+='<div class="mrow"><span class="nm">'+esc(x[0])+'</span><span class="pv">'+x[1]+'%</span><div class="tr"><i style="width:'+x[1]+'%"></i></div></div>';});});
    html+='<p class="note">'+esc(pred.why||"Predicted from both teams’ results over the last 30 days.")+' Estimates, not guarantees.</p></div>';
    if(pred.form&&(pred.form.h||pred.form.a)){
      html+='<div class="card"><h3>Recent form</h3>';
      html+='<div class="mrow"><span class="nm">'+esc(h.name)+'</span><span class="pv">'+esc(pred.form.h||"no stored results")+'</span></div>';
      html+='<div class="mrow"><span class="nm">'+esc(a.name)+'</span><span class="pv">'+esc(pred.form.a||"no stored results")+'</span></div>';
      html+='<p class="note">Last five finished matches in our stored results, oldest to newest: W win, D draw, L loss.</p></div>';
    }
    if(pred.h2h&&pred.h2h.list&&pred.h2h.list.length){
      const hh=pred.h2h;
      html+='<div class="card"><h3>Head to head</h3>';
      hh.list.slice().reverse().forEach(r=>{html+='<div class="mrow"><span class="nm">'+esc(r.d)+'</span><span class="pv">'+r.sh+' – '+r.sa+'</span></div>';});
      html+='<p class="note">'+esc(h.name)+' '+hh.hw+(hh.hw===1?" win":" wins")+' · '+hh.dr+(hh.dr===1?" draw":" draws")+' · '+esc(a.name)+' '+hh.aw+(hh.aw===1?" win":" wins")+', from the results we store.</p></div>';
    }
  }
  html+='<div class="card" id="vote"><h3>Who will win?</h3><p class="note">Loading the fan vote…</p></div>';
  html+='<div class="card hidden" id="odds"></div>';
  html+='<div class="card hidden" id="info"></div>';
  $("app").innerHTML=html;
  loadVote();loadOdds();
  let s=[];try{s=JSON.parse(localStorage.getItem("fixturio:saved")||"[]")}catch(e){}
  if(s.includes(+mid)){const b=$("sv");b.classList.add("on");b.textContent="★ Saved";}
  if(info)renderInfo();
}
const VKEY="fixturio:vote:"+mid;
let vCnt={h:0,d:0,a:0},vTot=0,myVote=null;
function shortName(n){return n.length>14?n.slice(0,13)+"…":n;}
function renderVote(){
  const el=$("vote");if(!el||!m)return;
  const pred=p?p[mid]:null;
  let hh='<h3>Who will win?'+'</h3>';
  if(pred)hh+='<p class="note" style="margin:0 0 8px">Our model: '+esc(m.teams.home.name)+' '+pred.h+'% · Draw '+pred.d+'% · '+esc(m.teams.away.name)+' '+pred.a+'%</p>';
  hh+='<div class="acts" style="justify-content:flex-start;gap:6px">'
    +'<button id="vh"'+(myVote==="h"?' class="on"':'')+' onclick="vote(\'h\')">'+esc(shortName(m.teams.home.name))+'</button>'
    +'<button id="vd"'+(myVote==="d"?' class="on"':'')+' onclick="vote(\'d\')">Draw</button>'
    +'<button id="va"'+(myVote==="a"?' class="on"':'')+' onclick="vote(\'a\')">'+esc(shortName(m.teams.away.name))+'</button></div>';
  if(vTot>0){
    const p=k=>Math.round(vCnt[k]/vTot*100);
    hh+='<div class="mrow"><span class="nm">'+esc(m.teams.home.name)+'</span><span class="pv">'+p("h")+'%</span><div class="tr"><i style="width:'+p("h")+'%"></i></div></div>';
    hh+='<div class="mrow"><span class="nm">Draw</span><span class="pv">'+p("d")+'%</span><div class="tr"><i style="width:'+p("d")+'%"></i></div></div>';
    hh+='<div class="mrow"><span class="nm">'+esc(m.teams.away.name)+'</span><span class="pv">'+p("a")+'%</span><div class="tr"><i style="width:'+p("a")+'%"></i></div></div>';
    hh+='<p class="note">'+vTot+' vote'+(vTot===1?"":"s")+' so far.</p>';
  }else{
    hh+='<p class="note">'+(myVote?"Your vote is saved.":"Be the first to vote.")+'</p>';
  }
  el.innerHTML=hh;
}
function vote(c){
  if(myVote)return;
  myVote=c;vCnt[c]++;vTot++;
  try{localStorage.setItem(VKEY,c);}catch(e){}
  renderVote();
  fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fixture:mid,choice:c})})
    .then(r=>r.json()).then(d=>{
      if(d&&d.counts){vCnt={h:d.counts.h||0,d:d.counts.d||0,a:d.counts.a||0};vTot=vCnt.h+vCnt.d+vCnt.a;}
      renderVote();
    }).catch(function(){});
}
function loadVote(){
  try{myVote=localStorage.getItem(VKEY);}catch(e){}
  fetch("/api/vote?fixture="+mid).then(r=>r.json()).then(d=>{
    if(d&&d.counts){vCnt={h:d.counts.h||0,d:d.counts.d||0,a:d.counts.a||0};vTot=vCnt.h+vCnt.d+vCnt.a;}
    renderVote();
  }).catch(function(){renderVote();});
}
function loadOdds(){
  fetch("/daily.json").then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.matches)return;
    const dm=d.matches.find(x=>x.id===+mid);
    if(!dm||!dm.markets)return;
    const o={};
    dm.markets.forEach(mk=>{
      if(mk.kind!=="single")return;
      const n=String(mk.market||"").toLowerCase();
      if(n.indexOf("home win")===0)o.h=mk.odd;
      else if(n.indexOf("draw")===0)o.d=mk.odd;
      else if(n.indexOf("away win")===0)o.a=mk.odd;
    });
    if(o.h===undefined&&o.d===undefined&&o.a===undefined)return;
    const el=$("odds");if(!el)return;
    el.classList.remove("hidden");
    el.innerHTML='<h3>Bookmaker odds</h3><div class="acts" style="justify-content:flex-start;gap:6px">'
      +'<button>'+(o.h!==undefined?o.h:"–")+'</button><button>'+(o.d!==undefined?o.d:"–")+'</button><button>'+(o.a!==undefined?o.a:"–")+'</button></div>'
      +'<p class="note">1 home win · X draw · 2 away win. Odds move all day; check the bookmaker for the live price.</p>';
  }).catch(function(){});
}
function renderInfo(){
  const el=$("info");if(!el)return;
  el.classList.remove("hidden");
  let h="";
  if(info.events&&info.events.length){
    h+='<h3>Match timeline</h3>';
    info.events.slice().reverse().forEach(e=>{
      const dl=String(e.d||"").toLowerCase();
      const ic=e.ty==="Goal"?(dl.includes("own")?"⚽ (own goal)":dl.includes("penal")?"⚽ (pen)":"⚽"):e.ty==="Card"?(dl.includes("red")?"🟥":"🟨"):e.ty==="subst"?"🔄":"•";
      h+='<div class="ev"><div class="m2">'+(e.t!=null?e.t+"′":"")+" "+ic+'</div><div class="who"><b>'+esc(e.p)+"</b> <span>"+esc(e.team)+"</span></div></div>";
    });
  }else if(info.status==="NS"){h+="<h3>Match timeline</h3><p class='note'>The match has not started yet. Come back at kick-off.</p>";}
  else{h+="<h3>Match timeline</h3><p class='note'>No recorded events for this match.</p>";}
  if(info.stats&&info.stats.length===2){
    h+='<h3 style="margin-top:18px">Statistics</h3>';
    info.stats[0].s.forEach((r0,i)=>{
      const l=parseFloat(String(r0.v).replace("%",""))||0;
      const r1=info.stats[1].s[i]||{};const rv=parseFloat(String(r1.v).replace("%",""))||0;
      const tot=(l+rv)||1;
      h+='<div class="st2"><div class="l">'+esc(r0.v)+'</div><div><div class="bar"><i class="lft" style="width:'+Math.round(l/tot*100)+'%"></i><i class="rgt" style="width:'+Math.round(rv/tot*100)+'%"></i></div><div class="lbl">'+esc(r0.k)+'</div></div><div class="r">'+esc(r1.v||"")+"</div></div>";
    });
    h+='<div class="st2" style="grid-template-columns:1fr 1fr 1fr"><div class="l">'+esc(info.stats[0].team)+'</div><div class="lbl">Team</div><div class="r">'+esc(info.stats[1].team)+"</div></div>";
  }
  if(info.lineups&&info.lineups.length){
    h+='<h3 style="margin-top:18px">Line-ups</h3><div class="xi">';
    info.lineups.forEach(l=>{h+="<div><b>"+esc(l.team)+" · "+esc(l.formation||"")+"</b><ul>"+(l.xi||[]).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>";});
    h+="</div>";
  }
  if(info.venue)h+='<p class="note">'+esc(info.venue.name||"")+(info.venue.city?", "+esc(info.venue.city):"")+(info.referee?" · Referee: "+esc(info.referee):"")+"</p>";
  el.innerHTML=h;
  const b=$("evb");if(b)b.style.display="none";
}
function loadEvents(){
  const b=$("evb");if(b)b.textContent="Loading…";
  fetch("/api/match?id="+mid).then(r=>r.json()).then(d=>{
    if(d.error){if(b)b.textContent="Load events & stats";alert(d.error);return;}
    info=d;renderInfo();
  }).catch(()=>{const b=$("evb");if(b)b.textContent="Load events & stats";});
}
function share(){
  const txt=m.teams.home.name+" vs "+m.teams.away.name+" on Fixturio";
  if(navigator.share)navigator.share({title:"Fixturio",text:txt,url:location.href}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(location.href);
}
const tryDates=["0","-1","1"];let di=0;
function findIt(){
  if(di>=tryDates.length){render();return;}
  const off=tryDates[di++];
  fetch("/api/matches?date="+off).then(r=>r.json()).then(d=>{
    const f=(d.response||[]).find(x=>x.fixture.id===+mid);
    if(f)m=f;
    findIt();
  }).catch(()=>findIt());
}
findIt();
fetch("/all.json").then(r=>r.ok?r.json():null).then(d=>{if(d&&d.m){p=d.m;render();}}).catch(function(){});
</script>
<script src="/affiliate.js" defer></script>
