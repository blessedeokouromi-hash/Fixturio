<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4632">
<title>Fixturio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--turf:#0B4632;--deep:#083627;--chalk:#EEF3E6;--mute:rgba(238,243,230,.7);--line:rgba(238,243,230,.16);--live:#FF7A4D;--slip:#F4E6B0;--ink:#1D1B12;--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font:400 16px/1.4 var(--body);color:var(--chalk);background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 44px,rgba(0,0,0,.04) 44px 88px),var(--turf);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--slip);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
body.tm .wrap{padding-bottom:170px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(18px + env(safe-area-inset-top)) 16px 12px}
.brand h1{margin:0;font:800 38px/1 var(--disp);letter-spacing:.01em}
.brand span{display:block;margin-top:4px;font-size:13px;color:var(--mute)}
.tbtn{border:0;padding:11px 20px;background:var(--slip);color:var(--ink);font-weight:700;font-size:15px;-webkit-mask:radial-gradient(circle 6px at 0 50%,transparent 97%,#000) left/52% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 97%,#000) right/52% 100% no-repeat;mask:radial-gradient(circle 6px at 0 50%,transparent 97%,#000) left/52% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 97%,#000) right/52% 100% no-repeat}
.tabs{display:flex;align-items:center;gap:22px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 0;color:var(--mute);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--chalk);border-color:var(--chalk)}
.tabs span{margin-left:auto;font-size:12px;color:var(--mute)}
.lg{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:24px 16px 8px;border-bottom:1px solid var(--line)}
.lg b{font:800 22px/1.1 var(--disp);letter-spacing:.01em}
.lg span{font-size:13px;color:var(--mute);white-space:nowrap}
.lg.hot b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--live);vertical-align:middle;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.lg.hot b::before{animation:none}}
.mw{border-bottom:1px solid var(--line)}
.mw.dim{opacity:.45}
.m{display:grid;grid-template-columns:50px 1fr auto;column-gap:12px;align-items:center;padding:10px 16px;cursor:pointer}
body.tm .m{grid-template-columns:24px 50px 1fr auto}
.st{font:700 20px/1 var(--disp);text-align:center;color:var(--mute)}
.st.live{color:var(--live);font-size:22px}
.tn div{height:26px;line-height:26px;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .w{font-weight:700}
.sc{text-align:right}
.sc div{font:800 26px/26px var(--disp);height:26px}
.l{color:var(--mute)}
.ck{width:22px;height:22px;border:2px solid var(--chalk);border-radius:4px;display:grid;place-items:center;font-size:14px;font-weight:800;color:transparent}
.ck.on{background:var(--slip);border-color:var(--slip);color:var(--ink)}
.pn{display:none;padding:2px 16px 16px}
.pt{font-weight:700;font-size:14px;margin-bottom:8px}
.wc{display:flex;gap:3px;height:10px}
.wc i{display:block;border-radius:5px;min-width:0}
.wc i:nth-child(1){background:var(--chalk)}
.wc i:nth-child(2){background:#6C9C85}
.wc i:nth-child(3){background:var(--slip)}
.wl{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.wl span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;background:var(--chalk)}
.wl .k2::before{background:#6C9C85}
.wl .k3::before{background:var(--slip)}
.ad2{margin-top:10px;font-weight:600;color:var(--slip)}
.fine{margin:10px 0 0;font-size:12px;color:var(--mute)}
.hint{display:none;margin:14px 16px 0;padding:12px 14px;background:var(--deep);border-left:4px solid var(--slip);font-size:14px}
.advt{margin:18px 16px;padding:16px;border:1px dashed var(--line);color:var(--mute);font-size:12px;text-align:center}
.pad{padding:24px 16px}
.foot{padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
.dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--deep);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
body.tm .dock{display:block}
.dk{max-width:560px;margin:0 auto}
.dk1{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--chalk);color:var(--deep)}
.go{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:6px;background:var(--slip);color:var(--ink);font-weight:700;font-size:16px}
.slip{display:none;position:relative;margin:16px;padding:28px 18px 24px;background:var(--slip);color:var(--ink)}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 10px 0,var(--turf) 6px,transparent 6.5px) 0 0/20px 10px repeat-x}
.slip::before{top:0}
.slip::after{bottom:0;transform:scaleY(-1)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sh b{font:800 30px/1 var(--disp)}
.sh span{font-size:13px}
.leg{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed rgba(29,27,18,.4)}
.leg .mt{font-weight:700}
.leg .mk{font-weight:600;margin-top:2px}
.leg .rs{font-size:13px;margin-top:3px;color:#5B563F}
.slip .pc{font:800 30px/1 var(--disp);white-space:nowrap}
.slip .pc small{font-size:16px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.tot span{font-weight:700}
.tot b{font:800 46px/1 var(--disp)}
.slip .fine{color:#5B563F}
.msg{margin:14px 0 0}
</style></head><body>
<div class="wrap">
<header class="top">
  <div class="brand"><h1>Fixturio</h1><span id="date"></span></div>
  <button id="tbtn" class="tbtn" onclick="toggleMode()">Smart ticket</button>
</header>
<nav class="tabs"><a class="on" href="/">Matches</a><a href="/picks.html">Top 15</a><span id="upd"></span></nav>
<div id="hint" class="hint"></div>
<section id="slip" class="slip" aria-live="polite"></section>
<main id="app"><p class="msg pad">Loading matches…</p></main>
<div class="advt">Advertisement</div>
<p class="fine foot">18+ only. Predictions are estimates, not guarantees.</p>
</div>
<div class="dock"><div class="dk">
  <div class="dk1">
    <span id="cnt">0 of 10 chosen</span>
    <div class="seg" role="group" aria-label="Risk level">
      <button id="rsafe" onclick="setRisk('safe')">Safe</button>
      <button id="rbalanced" class="on" onclick="setRisk('balanced')">Balanced</button>
      <button id="rrisky" onclick="setRisk('risky')">Risky</button>
    </div>
  </div>
  <button class="go" onclick="build()">Build ticket</button>
</div></div>
<script>
const LIVE=["1H","2H","HT","ET","BT","P","LIVE"],DONE=["FT","AET","PEN"];
const open=new Set(),preds={},sel=new Set();
let data=[],ok=new Set(),mode=false,risk="balanced",failed="";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const isLive=m=>LIVE.includes(m.fixture.status.short);
const tm=d=>new Date(d).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});

function stat(m){
  const f=m.fixture,s=f.status.short;
  if(s==="HT")return "HT";
  if(isLive(m))return (f.status.elapsed||"")+"′";
  if(s==="NS")return tm(f.date);
  return s;
}

function row(m){
  const f=m.fixture,id=f.id,live=isLive(m),can=f.status.short==="NS"&&ok.has(id);
  const done=DONE.includes(f.status.short),gh=m.goals.home,ga=m.goals.away;
  const hw=done&&gh>ga,aw=done&&ga>gh;
  const hc=done?(hw?"w":(aw?"l":"")):"",ac=done?(aw?"w":(hw?"l":"")):"";
  const sc=gh===null?"":'<div class="'+hc+'">'+gh+'</div><div class="'+ac+'">'+ga+'</div>';
  const ck=mode?'<div class="ck'+(sel.has(id)?" on":"")+'" id="c'+id+'"'+(can?"":' style="visibility:hidden"')+'>✓</div>':"";
  return '<div class="mw'+(mode&&!can?" dim":"")+'"><div class="m" role="button" tabindex="0" onclick="tap('+id+','+(can?1:0)+')">'+ck+'<div class="st'+(live?" live":"")+'">'+esc(stat(m))+'</div><div class="tn"><div class="'+hc+'">'+esc(m.teams.home.name)+'</div><div class="'+ac+'">'+esc(m.teams.away.name)+'</div></div><div class="sc">'+sc+'</div></div><div class="pn" id="p'+id+'"'+(open.has(id)?' style="display:block"':"")+'>'+(preds[id]||"Loading win chances…")+'</div></div>';
}

function render(){
  if(!data.length){$("app").innerHTML='<p class="msg pad">'+esc(failed||"No fixtures are listed for today yet. Check back later.")+"</p>";return;}
  const g={};
  data.forEach(m=>{const k=m.league.id+"|"+m.league.country+"|"+m.league.name;(g[k]=g[k]||[]).push(m);});
  const hasLive=k=>g[k].some(isLive)?1:0,hasOk=k=>g[k].some(x=>ok.has(x.fixture.id))?1:0;
  const keys=Object.keys(g).sort((a,b)=>(hasLive(b)-hasLive(a))||(hasOk(b)-hasOk(a))||(g[b].length-g[a].length));
  let h="",i=0;
  keys.forEach(k=>{
    const p=k.split("|");
    const ms=g[k].sort((a,b)=>(isLive(b)-isLive(a))||(a.fixture.timestamp-b.fixture.timestamp));
    h+='<div class="lg'+(hasLive(k)?" hot":"")+'"><b>'+esc(p[2])+"</b><span>"+esc(p[1])+"</span></div>"+ms.map(row).join("");
    if(++i%4===0)h+='<div class="advt">Advertisement</div>';
  });
  $("app").innerHTML=h;
}

function predHTML(d){
  const p=(d.response||[])[0];
  if(!p)return "Win chances are not available for this match yet.";
  const pr=p.predictions,pc=pr.percent||{};
  const n=v=>parseInt(v)||0;
  const h=n(pc.home),x=n(pc.draw),a=n(pc.away);
  let o='<div class="pt">Win chances</div><div class="wc"><i style="width:'+h+'%"></i><i style="width:'+x+'%"></i><i style="width:'+a+'%"></i></div><div class="wl"><span>Home '+h+'%</span><span class="k2">Draw '+x+'%</span><span class="k3">Away '+a+'%</span></div>';
  if(pr.advice)o+='<div class="ad2">'+esc(pr.advice)+"</div>";
  return o+'<div class="fine">An estimate from form and statistics, not a guarantee.</div>';
}

function tog(id){
  const el=$("p"+id);
  if(open.has(id)){open.delete(id);el.style.display="none";return;}
  open.add(id);el.style.display="block";
  if(preds[id])return;
  fetch("/api/predictions?fixture="+id).then(r=>r.json()).then(d=>{
    preds[id]=predHTML(d);
    const e=$("p"+id);if(e)e.innerHTML=preds[id];
  }).catch(()=>{const e=$("p"+id);if(e)e.innerHTML="Win chances could not be loaded. Try again later.";});
}

function cnt(){$("cnt").textContent=sel.size+" of 10 chosen";}
function hintText(){return ok.size?"Choose 2 to 10 matches that have not started. Matches with a box were analysed this morning.":"This morning’s analysis is not ready yet, so tickets cannot be built right now.";}

function tap(id,can){
  if(mode){
    if(!can)return;
    if(sel.has(id))sel.delete(id);
    else if(sel.size>=10){$("hint").textContent="Ten matches is the limit for one ticket.";return;}
    else sel.add(id);
    const c=$("c"+id);if(c)c.classList.toggle("on",sel.has(id));
    $("hint").textContent=hintText();
    cnt();return;
  }
  tog(id);
}

function toggleMode(){
  mode=!mode;
  document.body.classList.toggle("tm",mode);
  $("tbtn").textContent=mode?"Close":"Smart ticket";
  $("hint").textContent=hintText();
  $("hint").style.display=mode?"block":"none";
  if(!mode){$("slip").style.display="none";sel.clear();}
  cnt();render();
}

function setRisk(r){risk=r;["safe","balanced","risky"].forEach(x=>$("r"+x).classList.toggle("on",x===r));}

function slipMsg(t){$("slip").innerHTML='<div class="sh"><b>Your ticket</b></div><p class="msg">'+esc(t)+"</p>";}

function build(){
  $("slip").style.display="block";
  window.scrollTo({top:0});
  if(sel.size<2){slipMsg("Choose at least 2 matches to build a ticket.");return;}
  slipMsg("Building your ticket…");
  const ids=[...sel].sort((a,b)=>a-b).join(",");
  fetch("/api/accumulator?ids="+ids+"&risk="+risk).then(r=>r.json()).then(d=>{
    if(d.error){slipMsg(d.error);return;}
    let h='<div class="sh"><b>Your ticket</b><span>'+esc(cap(risk))+" setting, "+esc(d.legs)+" legs</span></div>";
    (d.picks||[]).forEach(p=>{h+='<div class="leg"><div><div class="mt">'+esc(p.match)+'</div><div class="mk">'+esc(p.market)+'</div><div class="rs">'+esc(p.reason)+'</div></div><div class="pc">'+esc(p.probability)+"<small>%</small></div></div>";});
    h+='<div class="tot"><span>Combined chance</span><b>'+esc(d.combined)+'%</b></div><p class="fine">'+esc(d.summary)+'</p><p class="fine">18+ only. Estimates are not guarantees. Please gamble responsibly.</p>';
    $("slip").innerHTML=h;
  }).catch(()=>slipMsg("The ticket could not be built. Check your connection and try again."));
}

function load(){
  fetch("/api/matches").then(r=>r.json()).then(d=>{
    data=d.response||[];
    failed=(!data.length&&d.errors&&Object.keys(d.errors).length)?"Match data is temporarily unavailable. Please try again in a few minutes.":"";
    render();
    $("upd").textContent="Updated "+tm(new Date());
  }).catch(()=>{failed="Matches could not be loaded. Check your connection and reload.";render();});
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("m"))e.target.click();});
$("date").textContent=new Date().toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"});
load();
setInterval(load,60000);
fetch("/daily.json").then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.matches){ok=new Set(d.matches.map(m=>m.id));$("hint").textContent=hintText();render();}
}).catch(()=>{});
</script></body></html>
