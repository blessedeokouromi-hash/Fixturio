<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Fixturio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1220;--s1:#121B2E;--s2:#18233A;--line:#243049;--tx:#E8EDF7;--mu:#93A0BA;--amb:#F5B544;--live:#FF5B5B;--slip:#F4E6B0;--sink:#1D1B12;--f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--tx);font:500 15px/1.4 var(--f);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
body.tm .wrap{padding-bottom:180px}
.top{position:sticky;top:0;z-index:4;background:var(--ink);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;flex:none}
.logo b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.logo small{display:block;font-size:12px;color:var(--mu)}
.tbtn{border:0;padding:11px 20px;background:var(--slip);color:var(--sink);font-weight:700;font-size:15px;-webkit-mask:radial-gradient(circle 6px at 0 50%,transparent 97%,#000) left/52% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 97%,#000) right/52% 100% no-repeat;mask:radial-gradient(circle 6px at 0 50%,transparent 97%,#000) left/52% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 97%,#000) right/52% 100% no-repeat}
.tabs{display:flex;align-items:center;gap:22px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs a{padding:11px 0;color:var(--mu);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--tx);border-color:var(--amb)}
.tabs span{margin-left:auto;font-size:12px;color:var(--mu)}
.days{display:flex;gap:8px;padding:12px 16px 0}
.days button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 6px;font-weight:700;font-size:14px;line-height:1.25}
.days button small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
.days button.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.days button.on small{color:#46506A}
.sr{padding:10px 16px 0}
.sr input{width:100%;padding:11px 14px;background:var(--s1);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:16px}
.sr input::placeholder{color:var(--mu)}
.chips{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.cov{margin:0;padding:0 16px 6px;font-size:12px;color:var(--mu)}
.cov:empty{display:none}
.lg{display:flex;align-items:center;gap:10px;padding:18px 16px 8px}
.lg img{width:20px;height:20px;object-fit:contain}
.lg b{font-weight:800;font-size:15px}
.lg span{margin-left:auto;font-size:12px;color:var(--mu);white-space:nowrap}
.lg.hot b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-radius:50%;background:var(--live);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.lg.hot b::after{animation:none}}
.grp{background:var(--s1);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mw{border-top:1px solid var(--line)}
.mw:first-child{border-top:0}
.mw.dim{opacity:.45}
.m{display:grid;grid-template-columns:46px 1fr auto auto;column-gap:10px;align-items:center;padding:11px 16px;cursor:pointer}
body.tm .m{grid-template-columns:24px 46px 1fr auto auto}
.wrap.np .m{grid-template-columns:46px 1fr auto}
body.tm .wrap.np .m{grid-template-columns:24px 46px 1fr auto}
.st{text-align:center;font-size:13px;font-weight:700;color:var(--mu);line-height:1.2}
.st.live{color:var(--live)}
.dot{display:block;width:6px;height:6px;margin:5px auto 0;border-radius:50%;background:var(--amb)}
.tn{min-width:0}
.tn>div{display:flex;align-items:center;gap:8px;height:24px;font-size:15px;font-weight:600;min-width:0}
.tn img{width:18px;height:18px;object-fit:contain;flex:none}
.tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .w{font-weight:800}
.tn .l{color:var(--mu);font-weight:500}
.pr{display:grid;justify-items:center;gap:5px;min-width:54px}
.pill{font-weight:800;font-size:14px;padding:3px 9px;border-radius:7px;background:var(--s2);border:1px solid var(--line)}
.pill.ok{background:#1D4D33;border-color:#2F7F52;color:#8CE6B0}
.pill.bad{background:#4A1F27;border-color:#8A3340;color:#FF9AA4}
.sig{display:flex;gap:2px;align-items:flex-end;height:10px}
.sig i{display:block;width:4px;border-radius:1px;background:var(--line)}
.sig i:nth-child(1){height:4px}
.sig i:nth-child(2){height:7px}
.sig i:nth-child(3){height:10px}
.sig.s1 i:nth-child(1){background:#FF7A7A}
.sig.s2 i:nth-child(-n+2){background:var(--amb)}
.sig.s3 i{background:#5BD18B}
.sc{text-align:right;font-weight:800;font-size:15px;min-width:20px}
.sc div{height:24px;line-height:24px}
.sc.live div{color:var(--live)}
.sc .l{color:var(--mu);font-weight:600}
.ck{width:22px;height:22px;border:2px solid var(--mu);border-radius:5px;display:grid;place-items:center;font-size:14px;font-weight:800;color:transparent}
.ck.on{background:var(--amb);border-color:var(--amb);color:var(--ink)}
.pn{display:none;padding:2px 16px 18px;background:var(--s2);border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.two>div{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.two small{display:block;font-size:12px;color:var(--mu)}
.two b{display:block;margin-top:2px;font-weight:700}
.two em{font-style:normal;font-weight:800;color:var(--amb);font-size:20px}
.sec{margin-top:16px}
.sec h4{margin:0;font-size:13px;font-weight:700;color:var(--mu)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;margin-top:9px}
.mrow .nm{font-weight:600}
.mrow .pv{font-weight:800}
.mrow .tr{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--mu);border-radius:3px}
.mrow.best .nm,.mrow.best .pv{color:var(--amb)}
.mrow.best .tr i{background:var(--amb)}
.note{margin:14px 0 0;font-size:13px;color:var(--mu)}
.hint{display:none;margin:12px 16px 0;padding:12px 14px;background:var(--s1);border-left:4px solid var(--amb);font-size:14px}
.more{display:block;width:calc(100% - 32px);margin:18px 16px 0;padding:13px;border:1px solid var(--line);background:var(--s1);border-radius:10px;font-weight:700}
.pad{padding:24px 16px}
.msg{margin:14px 0 0}
.fine{margin:10px 0 0;font-size:12px;color:var(--mu)}
.foot{padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--s1);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
body.tm .dock{display:block}
.dk{max-width:560px;margin:0 auto}
.dk1{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--tx);color:var(--ink)}
.go{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:8px;background:var(--slip);color:var(--sink);font-weight:800;font-size:16px}
.slip{display:none;position:relative;margin:16px;padding:28px 18px 24px;background:var(--slip);color:var(--sink)}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 10px 0,var(--ink) 6px,transparent 6.5px) 0 0/20px 10px repeat-x}
.slip::before{top:0}
.slip::after{bottom:0;transform:scaleY(-1)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:2px solid var(--sink)}
.sh b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sh span{font-size:13px}
.leg{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed rgba(29,27,18,.4)}
.leg .mt{font-weight:700}
.leg .mk{font-weight:600;margin-top:2px}
.leg .rs{font-size:13px;margin-top:3px;color:#5B563F}
.slip .pc{font-size:22px;font-weight:800;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.tot span{font-weight:700}
.tot b{font-size:38px;font-weight:800;letter-spacing:-.02em}
.slip .fine{color:#5B563F}
</style></head><body>
<div class="wrap" id="wrap">
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F5B544"/><circle cx="16" cy="16" r="6" fill="none" stroke="#0B1220" stroke-width="2"/><path d="M16 4v24" stroke="#0B1220" stroke-width="2"/></svg>
    <div><b>Fixturio</b><small id="date"></small></div>
  </div>
  <button id="tbtn" class="tbtn" onclick="toggleMode()">Smart ticket</button>
</header>
<nav class="tabs"><a class="on" href="/">Matches</a><a href="/picks.html">Top 15</a><a href="/tools.html">Tools</a><span id="upd"></span></nav>
<div id="days" class="days"></div>
<div class="sr"><input id="q" type="search" placeholder="Search team, league or country" oninput="setQ(this.value)" aria-label="Search matches" autocomplete="off"></div>
<div id="chips" class="chips"></div>
<p id="cov" class="cov"></p>
<div id="hint" class="hint"></div>
<section id="slip" class="slip" aria-live="polite"></section>
<main id="app"><p class="msg pad">Loading matches…</p></main>
<p class="fine foot">18+ only. Predictions are estimates, not guarantees. A dot beside a time means a deeper analysis using bookmaker odds.</p>
</div>
<div class="dock"><div class="dk">
  <div class="dk1">
    <span id="cnt">0 of 10 chosen</span>
    <div class="seg" role="group" aria-label="Risk level">
      <button id="rsafe" onclick="setRisk('safe')">Safe</button>
      <button id="rbalanced" class="on" onclick="setRisk('balanced')">Balanced</button>
      <button id="rrisky" onclick="setRisk('risky')">Risky</button>
    </div>
  </div>
  <button class="go" onclick="build()">Build ticket</button>
</div></div>
<script>
const LIVE=["1H","2H","HT","ET","BT","P","LIVE"],DONE=["FT","AET","PEN"];
const TOPL=[1,2,3,4,5,6,10,12,29,32,848,39,140,135,78,61,88,94,144,203,40,253,71,128,179];
const open=new Set(),panels={},sel=new Set(),info={};
let data=[],pred={},cov=null,loaded=false,mode=false,risk="balanced",filter="all",failed="",day=0,q="",moreOpen=false,npCol=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const isLive=m=>LIVE.includes(m.fixture.status.short);
const ana=id=>!!info[id];
const hasP=id=>!!pred[id]||!!info[id];
const tr=id=>TOPL.indexOf(id);
const tm=d=>new Date(d).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const dateStr=o=>new Date(Date.now()+o*864e5).toISOString().slice(0,10);
const img=u=>u?'<img src="'+esc(u)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':"";

function stat(m){
  const f=m.fixture,s=f.status.short;
  if(s==="HT")return "HT";
  if(isLive(m))return (f.status.elapsed||"")+"′";
  if(s==="NS")return tm(f.date);
  return s;
}

function predCell(m){
  const p=pred[m.fixture.id];
  if(!p)return '<div class="pr"></div>';
  const sp=p.s.split("-"),ps=+sp[0],pa=+sp[1];
  const mx=Math.max(p.h,p.d,p.a);
  const lv=mx>=60?3:mx>=45?2:1;
  let cls="";
  if(DONE.includes(m.fixture.status.short)&&m.goals.home!==null){
    const po=ps>pa?"H":ps<pa?"A":"D";
    const ao=m.goals.home>m.goals.away?"H":m.goals.home<m.goals.away?"A":"D";
    cls=po===ao?" ok":" bad";
  }
  return '<div class="pr" title="Predicted score, confidence '+mx+'%"><span class="pill'+cls+'">'+esc(p.s)+'</span><span class="sig s'+lv+'" role="img" aria-label="Confidence '+(lv===3?"high":lv===2?"medium":"low")+'"><i></i><i></i><i></i></span></div>';
}

function row(m){
  const f=m.fixture,id=f.id,live=isLive(m),can=f.status.short==="NS"&&ana(id);
  const done=DONE.includes(f.status.short),gh=m.goals.home,ga=m.goals.away;
  const hw=done&&gh>ga,aw=done&&ga>gh;
  const hc=done?(hw?"w":(aw?"l":"")):"",ac=done?(aw?"w":(hw?"l":"")):"";
  const sc=gh===null?"":'<div class="'+hc+'">'+gh+'</div><div class="'+ac+'">'+ga+"</div>";
  const ck=mode?'<div class="ck'+(sel.has(id)?" on":"")+'" id="c'+id+'"'+(can?"":' style="visibility:hidden"')+">✓</div>":"";
  return '<div class="mw'+(mode&&!can?" dim":"")+'"><div class="m" role="button" tabindex="0" onclick="tap('+id+','+(can?1:0)+')">'+ck+'<div class="st'+(live?" live":"")+'">'+esc(stat(m))+(ana(id)?'<i class="dot"></i>':"")+'</div><div class="tn"><div class="'+hc+'">'+img(m.teams.home.logo)+"<span>"+esc(m.teams.home.name)+'</span></div><div class="'+ac+'">'+img(m.teams.away.logo)+"<span>"+esc(m.teams.away.name)+"</span></div></div>"+(npCol?"":predCell(m))+'<div class="sc'+(live?" live":"")+'">'+sc+'</div></div><div class="pn" id="p'+id+'"'+(open.has(id)?' style="display:block"':"")+">"+(panels[id]||"")+"</div></div>";
}

function days(){
  const nm=["Yesterday","Today","Tomorrow"];
  $("days").innerHTML=[-1,0,1].map(o=>{
    const s=new Date(Date.now()+o*864e5).toLocaleDateString([],{weekday:"short",day:"numeric"});
    return '<button class="'+(day===o?"on":"")+'" onclick="setDay('+o+')">'+nm[o+1]+"<small>"+esc(s)+"</small></button>";
  }).join("");
}
function setDay(o){
  if(o===day)return;
  day=o;loaded=false;data=[];failed="";moreOpen=false;filter="all";
  $("app").innerHTML='<p class="msg pad">Loading matches…</p>';
  days();load();
}
function setQ(v){q=v;render();}
function toggleMore(){moreOpen=!moreOpen;render();}

function chips(){
  const nl=data.filter(isLive).length,nt=data.filter(m=>tr(m.league.id)>=0).length,np=data.filter(m=>hasP(m.fixture.id)).length,na=data.filter(m=>ana(m.fixture.id)).length;
  const c=[["all","All",data.length],["live","Live",nl],["top","Top leagues",nt]];
  if(np)c.push(["pre","Predicted",np]);
  if(na)c.push(["ana","Top picks",na]);
  if(!c.some(x=>x[0]===filter))filter="all";
  $("chips").innerHTML=c.map(x=>'<button class="chip'+(filter===x[0]?" on":"")+'" onclick="setFilter(\''+x[0]+'\')">'+x[1]+" "+x[2]+"</button>").join("");
  const n=Object.keys(pred).length;
  $("cov").textContent=(cov&&day===0&&n&&data.length)?"Predicted score and confidence bars for "+n+" matches in "+cov.leagues+" leagues. More green bars means more confident.":"";
}
function setFilter(f){filter=f;moreOpen=false;render();}

function render(){
  if(!loaded)return;
  npCol=!data.some(m=>pred[m.fixture.id]);
  $("wrap").classList.toggle("np",npCol);
  chips();
  const qq=q.trim().toLowerCase();
  const list=data.filter(m=>{
    if(qq&&(m.teams.home.name+" "+m.teams.away.name+" "+m.league.name+" "+m.league.country).toLowerCase().indexOf(qq)<0)return false;
    if(filter==="live")return isLive(m);
    if(filter==="pre")return hasP(m.fixture.id);
    if(filter==="ana")return ana(m.fixture.id);
    if(filter==="top")return tr(m.league.id)>=0;
    return true;
  });
  if(!list.length){
    const t=!data.length?(failed||"No fixtures are listed for this day yet. Check back later."):(qq?"No matches found for that search.":filter==="live"?"No matches are live right now.":"Nothing here yet.");
    $("app").innerHTML='<p class="msg pad">'+esc(t)+"</p>";return;
  }
  const g={};
  list.forEach(m=>{const k=m.league.id+"|"+m.league.country+"|"+m.league.name;(g[k]=g[k]||[]).push(m);});
  const keys=Object.keys(g);
  const lid=k=>+k.split("|")[0];
  const isTop=k=>tr(lid(k))>=0;
  const hasLive=k=>g[k].some(isLive)?1:0,hasPr=k=>g[k].some(x=>hasP(x.fixture.id))?1:0;
  const topK=keys.filter(isTop).sort((a,b)=>(hasLive(b)-hasLive(a))||(tr(lid(a))-tr(lid(b))));
  const restK=keys.filter(k=>!isTop(k)).sort((a,b)=>(hasLive(b)-hasLive(a))||(hasPr(b)-hasPr(a))||(g[b].length-g[a].length));
  const expand=filter!=="all"||!!qq;
  const group=k=>{
    const p=k.split("|");
    const ms=g[k].sort((a,b)=>(isLive(b)-isLive(a))||(a.fixture.timestamp-b.fixture.timestamp));
    return '<div class="lg'+(hasLive(k)?" hot":"")+'">'+img(ms[0].league.logo)+"<b>"+esc(p[2])+"</b><span>"+esc(p[1])+'</span></div><div class="grp">'+ms.map(row).join("")+"</div>";
  };
  let h=topK.map(group).join("");
  const showRest=(expand||moreOpen)?restK.length:(topK.length?0:Math.min(15,restK.length));
  h+=restK.slice(0,showRest).map(group).join("");
  const hid=restK.slice(showRest);
  if(hid.length){
    const n=hid.reduce((s,k)=>s+g[k].length,0);
    h+='<button class="more" onclick="toggleMore()">Show '+hid.length+" more leagues ("+n+" matches)</button>";
  }else if(moreOpen&&!expand&&topK.length&&restK.length){
    h+='<button class="more" onclick="toggleMore()">Hide other leagues</button>';
  }
  $("app").innerHTML=h;
}

function panel(rows,notes){
  if(!rows.length)return '<p class="note">'+esc(notes)+"</p>";
  const top=(a,b)=>b.p>a.p?b:a;
  const b1=rows.reduce(top);
  const singles=rows.filter(r=>r.g!=="Double chance"&&r.label!=="Draw");
  const b2=singles.length?singles.reduce(top):null;
  let h='<div class="two"><div><small>Safest pick</small><b>'+esc(b1.label)+"</b><em>"+b1.p+"%</em></div>";
  if(b2&&b2!==b1)h+='<div><small>Best single market</small><b>'+esc(b2.label)+"</b><em>"+b2.p+"%</em></div>";
  h+="</div>";
  const g={};
  rows.forEach(r=>{(g[r.g]=g[r.g]||[]).push(r);});
  Object.keys(g).forEach(k=>{
    h+='<div class="sec"><h4>'+esc(k)+"</h4>";
    g[k].forEach(r=>{h+='<div class="mrow'+(r===b1?" best":"")+'"><span class="nm">'+esc(r.label)+'</span><span class="pv">'+r.p+'%</span><div class="tr"><i style="width:'+r.p+'%"></i></div></div>';});
    h+="</div>";
  });
  return h+(notes?'<p class="note">'+esc(notes)+"</p>":"");
}

function dailyRows(dm,home,away){
  const mk={};dm.markets.forEach(x=>{mk[x.market]=Math.round(x.prob*100);});
  const h=mk["Home win"],a=mk["Away win"],x1=mk["Double chance 1X (home or draw)"],x2=mk["Double chance X2 (away or draw)"],x12=mk["Double chance 12 (no draw)"];
  const r=[];
  if(h!=null)r.push({g:"Match result",label:home+" win",p:h});
  if(x1!=null&&x2!=null)r.push({g:"Match result",label:"Draw",p:Math.max(0,x1+x2-100)});
  if(a!=null)r.push({g:"Match result",label:away+" win",p:a});
  if(x1!=null)r.push({g:"Double chance",label:home+" or draw",p:x1});
  if(x2!=null)r.push({g:"Double chance",label:away+" or draw",p:x2});
  if(x12!=null)r.push({g:"Double chance",label:home+" or "+away,p:x12});
  if(mk["Over 2.5 goals"]!=null){
    r.push({g:"Total goals",label:"Over 2.5 goals",p:mk["Over 2.5 goals"]});
    r.push({g:"Total goals",label:"Under 2.5 goals",p:mk["Under 2.5 goals"]||0});
  }
  if(mk["Both teams to score"]!=null){
    r.push({g:"Both teams to score",label:"Yes",p:mk["Both teams to score"]});
    r.push({g:"Both teams to score",label:"No",p:mk["Both teams not to score"]||0});
  }
  return r;
}
function dailyNote(dm,home,away){
  let t="Based on "+dm.src+".";
  if(dm.form&&dm.form.home&&dm.form.away)t+=" Recent form: "+home+" "+dm.form.home+", "+away+" "+dm.form.away+".";
  return t+" Estimates, not guarantees.";
}

function modelRows(p,home,away){
  return [
    {g:"Match result",label:home+" win",p:p.h},
    {g:"Match result",label:"Draw",p:p.d},
    {g:"Match result",label:away+" win",p:p.a},
    {g:"Double chance",label:home+" or draw",p:Math.min(100,p.h+p.d)},
    {g:"Double chance",label:away+" or draw",p:Math.min(100,p.d+p.a)},
    {g:"Double chance",label:home+" or "+away,p:Math.min(100,p.h+p.a)},
    {g:"Total goals",label:"Over 2.5 goals",p:p.o},
    {g:"Total goals",label:"Under 2.5 goals",p:100-p.o},
    {g:"Both teams to score",label:"Yes",p:p.b},
    {g:"Both teams to score",label:"No",p:100-p.b}
  ];
}

function predPanel(d,home,away){
  const p=(d.response||[])[0];
  if(!p)return panel([],"No prediction is available for this match. Predictions cover the main leagues each morning.");
  const pr=p.predictions,pc=pr.percent||{};
  const n=v=>parseInt(v)||0;
  let h=n(pc.home),x=n(pc.draw),a=n(pc.away);
  const s=h+x+a;
  if(s>0){h=Math.round(h*100/s);x=Math.round(x*100/s);a=Math.max(0,100-h-x);}
  const rows=[
    {g:"Match result",label:home+" win",p:h},
    {g:"Match result",label:"Draw",p:x},
    {g:"Match result",label:away+" win",p:a},
    {g:"Double chance",label:home+" or draw",p:Math.min(100,h+x)},
    {g:"Double chance",label:away+" or draw",p:Math.min(100,x+a)},
    {g:"Double chance",label:home+" or "+away,p:Math.min(100,h+a)}
  ];
  let note=pr.advice?pr.advice+". ":"";
  const uo=pr.under_over?String(pr.under_over):"";
  if(uo)note+="Goals lean "+(uo.charAt(0)==="-"?"under ":"over ")+uo.replace(/^[+-]/,"")+". ";
  return panel(rows,note+"Estimates, not guarantees.");
}

function tog(id){
  const el=$("p"+id);
  if(open.has(id)){open.delete(id);el.style.display="none";return;}
  open.add(id);el.style.display="block";
  if(panels[id])return;
  const mm=data.find(x=>x.fixture.id===id);
  if(!mm)return;
  const home=mm.teams.home.name,away=mm.teams.away.name;
  if(info[id]){panels[id]=panel(dailyRows(info[id],home,away),dailyNote(info[id],home,away));el.innerHTML=panels[id];return;}
  if(pred[id]){panels[id]=panel(modelRows(pred[id],home,away),"Predicted score "+pred[id].s+". Estimated from both teams’ results over the last 30 days. Estimates, not guarantees.");el.innerHTML=panels[id];return;}
  el.innerHTML='<p class="note">Loading predictions…</p>';
  fetch("/api/predictions?fixture="+id).then(r=>r.json()).then(d=>{
    panels[id]=predPanel(d,home,away);
    const e=$("p"+id);if(e)e.innerHTML=panels[id];
  }).catch(()=>{const e=$("p"+id);if(e)e.innerHTML='<p class="note">Predictions could not be loaded. Try again later.</p>';});
}

function cnt(){$("cnt").textContent=sel.size+" of 10 chosen";}
function hintText(){return Object.keys(info).length?"Choose 2 to 10 matches that have not started. Matches with a dot beside the time can be used in tickets.":"This morning’s analysis is not ready yet, so tickets cannot be built right now.";}

function tap(id,can){
  if(mode){
    if(!can)return;
    if(sel.has(id))sel.delete(id);
    else if(sel.size>=10){$("hint").textContent="Ten matches is the limit for one ticket.";return;}
    else sel.add(id);
    const c=$("c"+id);if(c)c.classList.toggle("on",sel.has(id));
    $("hint").textContent=hintText();
    cnt();return;
  }
  tog(id);
}

function toggleMode(){
  mode=!mode;
  document.body.classList.toggle("tm",mode);
  $("tbtn").textContent=mode?"Close":"Smart ticket";
  $("hint").textContent=hintText();
  $("hint").style.display=mode?"block":"none";
  filter=mode&&Object.keys(info).length?"ana":"all";
  moreOpen=false;
  if(!mode){$("slip").style.display="none";sel.clear();}
  cnt();render();
}

function setRisk(r){risk=r;["safe","balanced","risky"].forEach(x=>$("r"+x).classList.toggle("on",x===r));}

function slipMsg(t){$("slip").innerHTML='<div class="sh"><b>Your ticket</b></div><p class="msg">'+esc(t)+"</p>";}

function build(){
  $("slip").style.display="block";
  window.scrollTo({top:0});
  if(sel.size<2){slipMsg("Choose at least 2 matches to build a ticket.");return;}
  slipMsg("Building your ticket…");
  const ids=[...sel].sort((a,b)=>a-b).join(",");
  fetch("/api/accumulator?ids="+ids+"&risk="+risk).then(r=>r.json()).then(d=>{
    if(d.error){slipMsg(d.error);return;}
    let h='<div class="sh"><b>Your ticket</b><span>'+esc(cap(risk))+" setting, "+esc(d.legs)+" legs</span></div>";
    (d.picks||[]).forEach(p=>{h+='<div class="leg"><div><div class="mt">'+esc(p.match)+'</div><div class="mk">'+esc(p.market)+'</div><div class="rs">'+esc(p.reason)+'</div></div><div class="pc">'+esc(p.probability)+"%</div></div>";});
    h+='<div class="tot"><span>Combined chance</span><b>'+esc(d.combined)+'%</b></div><p class="fine">'+esc(d.summary)+'</p><p class="fine">18+ only. Estimates are not guarantees. Please gamble responsibly.</p>';
    $("slip").innerHTML=h;
  }).catch(()=>slipMsg("The ticket could not be built. Check your connection and try again."));
}

function load(){
  const d0=day;
  fetch("/api/matches?date="+dateStr(day)).then(r=>r.json()).then(d=>{
    if(d0!==day)return;
    data=d.response||[];
    failed=(!data.length&&d.errors&&Object.keys(d.errors).length)?"Match data is temporarily unavailable. Please try again in a few minutes.":"";
    loaded=true;render();
    $("upd").textContent="Updated "+tm(new Date());
  }).catch(()=>{if(d0!==day)return;failed="Matches could not be loaded. Check your connection and reload.";loaded=true;render();});
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("m"))e.target.click();});
$("date").textContent=new Date().toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"});
days();
load();
setInterval(()=>{if(day===0)load();},60000);
fetch("/daily.json").then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.matches){d.matches.forEach(m=>{info[m.id]=m;});$("hint").textContent=hintText();render();}
}).catch(()=>{});
fetch("/all.json").then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.m){pred=d.m;cov=d;render();}
}).catch(()=>{});
</script><script src="/markets.js"></script><script src="/share.js"></script></body></html>
