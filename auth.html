<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sign in to Fixturio to sync your saved matches across every device.">
<title>Sign in | Fixturio</title>
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/fix.css">
<style>
.logo svg{width:32px;height:32px;flex:none}
.authwrap{max-width:420px;margin:0 auto}
.tabs2{display:flex;gap:8px;margin-bottom:18px}
.tabs2 button{flex:1;border:1px solid var(--line,#dfe5e2);background:transparent;color:var(--mu,#7a8a84);font:inherit;font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.tabs2 button.on{background:var(--acc,#123F33);color:#fff;border-color:var(--acc,#123F33)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid var(--line,#dfe5e2);border-radius:10px;background:var(--bg2,#f4f6f5)}
.add{margin-top:16px}
.link{border:0;background:transparent;color:var(--mu,#7a8a84);font:inherit;font-size:13px;padding:0;margin-top:12px;cursor:pointer;text-decoration:underline}
.acctin{display:flex;flex-direction:column;gap:10px}
.acctin[hidden]{display:none}
#formbox[hidden]{display:none}
</style>
</head><body>
<div class="wrap">
<header class="top"><a class="logo" href="/"><img src="/logo.png" alt="Fixturio logo" style="width:32px;height:32px;flex:none;border-radius:8px"><b>Fixturio</b></a><a href="/">All matches</a></header>
<nav class="tabs tabsx"><a href="/">Matches</a><a href="/picks.html">Top 15</a><a href="/basketball.html">Basketball</a><a href="/standings.html">Standings</a><a href="/news.html">News</a><a href="/video.html">Video</a><a href="/saved.html">Saved</a><a href="/tools.html">Tools</a><a href="/community.html">Community</a></nav>
<section class="intro"><h2>Account</h2><p>Sign in so your saved matches follow you to every device.</p></section>
<main>
<div class="card authwrap">
  <div id="state"></div>
  <div id="formbox">
  <form id="form">
    <div class="tabs2"><button type="button" id="tab-in" class="on">Sign in</button><button type="button" id="tab-up">Create account</button></div>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required minlength="6">
    <button class="add" id="go" type="submit">Sign in</button>
  </form>
  <button type="button" id="forgot" class="link">Forgot password?</button>
  </div>
  <p class="msg" id="msg"></p>
  <div id="signedin" class="acctin" hidden><p id="who"></p><a class="add" href="/saved.html">Go to your saved matches</a><button type="button" id="out" class="link">Sign out</button></div>
  <div id="setpwbox" class="acctin" hidden><p><b>Choose a new password</b></p><label for="npw">New password</label><input id="npw" type="password" autocomplete="new-password" required minlength="6"><button class="add" id="savepw" type="button">Save new password</button></div>
</div>
</main>
<p class="fine">By creating an account you agree to our <a href="/info.html#terms">terms</a> and <a href="/info.html#privacy">privacy policy</a>.</p>
</div>
<script src="/auth.js"></script>
<script>
const $=id=>document.getElementById(id);
let mode="in";
function setMode(m){mode=m;$("tab-in").classList.toggle("on",m==="in");$("tab-up").classList.toggle("on",m!=="in");$("go").textContent=m==="in"?"Sign in":"Create account";$("pw").autocomplete=m==="in"?"current-password":"new-password";$("msg").textContent="";}
$("tab-in").onclick=()=>setMode("in");
$("tab-up").onclick=()=>setMode("up");
function showSignedIn(u){$("formbox").hidden=true;$("forgot").hidden=true;$("signedin").hidden=false;$("who").textContent="Signed in as "+(u.email||u.id);}
function offline(){$("formbox").hidden=true;$("forgot").hidden=true;$("msg").textContent="Accounts are being set up right now. Check back soon.";}
$("form").onsubmit=async e=>{
  e.preventDefault();$("msg").textContent="";$("go").disabled=true;
  try{
    if(!window.fxAuth||!fxAuth.enabled()){offline();return;}
    const email=$("email").value.trim(),pw=$("pw").value;
    if(mode==="in"){
      const r=await fxAuth.signIn(email,pw);
      if(r.error){$("msg").textContent=r.error.message;$("go").disabled=false;return;}
      location.href="/saved.html";
    }else{
      const r=await fxAuth.signUp(email,pw);
      if(r.error){$("msg").textContent=r.error.message;$("go").disabled=false;return;}
      if(r.data&&r.data.session){location.href="/saved.html";}
      else{$("msg").textContent="Account created. Check your email to confirm it, then sign in.";$("go").disabled=false;setMode("in");}
    }
  }catch(err){$("msg").textContent="Something went wrong. Please try again.";$("go").disabled=false;}
};
$("forgot").onclick=async()=>{
  const email=$("email").value.trim();
  if(!email){$("msg").textContent="Type your email first, then tap Forgot password.";return;}
  try{const r=await fxAuth.reset(email);$("msg").textContent=r.error?r.error.message:"Reset link sent to your email.";}catch(err){$("msg").textContent="Something went wrong. Please try again.";}
};

$("savepw").onclick=async()=>{  const pw=$("npw").value;  if(pw.length<6){$("msg").textContent="Password must be at least 6 characters.";return;}  $("savepw").disabled=true;  try{    const r=await fxAuth.setPassword(pw);    if(r&&r.error){$("msg").textContent=r.error.message;$("savepw").disabled=false;return;}    try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}    $("msg").textContent="Password updated. You are signed in with your new password.";    $("setpwbox").hidden=true;    if(fxAuth.user())showSignedIn(fxAuth.user());  }catch(err){$("msg").textContent="Something went wrong. Please try again.";$("savepw").disabled=false;}};function showSetPw(){$("formbox").hidden=true;$("forgot").hidden=true;$("signedin").hidden=true;$("setpwbox").hidden=false;}if(/type=recovery/.test(location.hash)){  (function(){let n=0;const t=setInterval(async()=>{n++;    if(window.fxAuth&&fxAuth.enabled()){      await fxAuth.ready();      if(fxAuth.user()){clearInterval(t);showSetPw();}      else if(n>16){clearInterval(t);$("msg").textContent="This reset link has expired or was already used. Tap Forgot password to get a new one.";}    }else if(n>16){clearInterval(t);}  },300);})();}
$("out").onclick=async()=>{try{await fxAuth.signOut();}catch(e){}location.reload();};
if(window.fxAuth)fxAuth.on(u=>{
  if(u)showSignedIn(u);
  else if(!fxAuth.enabled())offline();
});
</script>
</body><script src="/ads.js" defer></script>
</html>
