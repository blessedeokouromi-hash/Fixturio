<!DOCTYPE html>
<html lang="en"><head><script src="https://quge5.com/88/tag.min.js" data-zone="313892" async data-cfasync="false"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5A3C">
<meta name="description" content="Football news, transfer headlines and match previews from BBC Sport, Sky Sports and ESPN, refreshed daily on Fixturio.">
<link rel="canonical" href="https://fixturio.vercel.app/news.html">
<title>Football news and transfers | Fixturio</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:500 15px/1.4 var(--f);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:4;background:var(--pitch);border-bottom:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:32px;height:32px;flex:none}
.logo b{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em}
.tabs{display:flex;align-items:center;gap:22px;padding:0 16px;background:var(--pitch);border-bottom:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:11px 0;color:var(--hmu);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--amb)}

.tabs span{margin-left:auto;font-size:12px;color:var(--hmu)}
.intro{padding:22px 16px 8px}
.intro h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.intro p{margin:8px 0 0;color:var(--mu);max-width:46ch}
.chips{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--tx)}
.chip.on{background:var(--tx);color:var(--ink);border-color:var(--tx)}
.rows{background:var(--s1);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.it{display:block;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.it:first-child{border-top:0}
.it b{display:block;font-weight:700;line-height:1.35}
.it p{margin:5px 0 0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it small{display:block;margin-top:6px;font-size:12px;color:var(--mu)}
.fine{margin:14px 16px 0;font-size:12px;color:var(--mu)}
.adslot{min-height:60px;margin:12px 16px;display:flex;justify-content:center;align-items:center}
.adslot:empty{display:none}
.msg{margin:24px 16px;color:var(--mu)}
</style><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"></head><body>
<div class="wrap">
<header class="top"><a class="logo" href="/"><img src="/logo.png" alt="Fixturio logo" style="width:32px;height:32px;flex:none;border-radius:8px"><b>Fixturio</b></a></header>
<nav class="tabs tabsx"><a href="/">Matches</a><a href="/picks.html">Top 15</a><a href="/standings.html">Standings</a><a class="on" href="/news.html">News</a><a href="/video.html">Video</a><a href="/saved.html">Saved</a><a href="/tools.html">Tools</a><span id="upd"></span></nav>
<section class="intro"><h2>Football news</h2><p>Headlines from BBC Sport, Sky Sports and ESPN, gathered fresh each morning. Tap a story to read it at the source.</p></section>
<div class="chips" id="chips">
<button class="chip on" onclick="setF('all')">All</button>
<button class="chip" onclick="setF('transfers')">Transfers</button>
<button class="chip" onclick="setF('news')">Matches &amp; teams</button>
</div>
<main id="app"><p class="msg">Loading headlines…</p></main>
<div class="bet-cta" data-banner="1"></div><p class="fine">Links lead to external sites we do not control. Headlines refresh once a day.</p>
</div>

<script>
let D=null,f="all";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(t){const d=(Date.now()-t)/60000;if(d<60)return Math.max(1,Math.round(d))+" min ago";if(d<1440)return Math.round(d/60)+" h ago";return Math.round(d/1440)+" d ago";}
function setF(x){f=x;document.querySelectorAll("#chips .chip").forEach(b=>b.classList.toggle("on",b.textContent.toLowerCase().startsWith(x==="all"?"all":x.slice(0,4))));render();}
function render(){
  if(!D)return;
  const list=(D.items||[]).filter(i=>f==="all"||i.cat===f);
  if(!list.length){$("app").innerHTML='<p class="msg">Nothing here yet. Headlines build each morning.</p>';return;}
  $("app").innerHTML='<div class="rows">'+list.map(i=>'<a class="it" href="'+esc(i.link)+'" target="_blank" rel="noopener"><b>'+esc(i.title)+"</b><p>"+esc(i.desc||"")+"</p><small>"+esc(i.source)+" · "+ago(i.ts)+"</small></a>").join("")+"</div>";
}
fetch("/news.json").then(r=>r.ok?r.json():null).then(d=>{
  D=d;
  if(d&&d.generated)$("upd").textContent="Built "+new Date(d.generated).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  render();
}).catch(()=>{$("app").innerHTML='<p class="msg">News could not be loaded. Try again shortly.</p>';});
</script>
<script src="/affiliate.js" defer></script></body></html>
