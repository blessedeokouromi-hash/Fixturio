<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5A3C">
<title>Basketball picks | Fixturio</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:500 15px/1.4 var(--f);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:4;background:var(--pitch);border-bottom:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:32px;height:32px;flex:none;border-radius:8px}
.logo b{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em}
.top>a{color:var(--hmu);text-decoration:none;font-weight:700}
.tabs{display:flex;align-items:center;gap:22px;padding:0 16px;background:var(--pitch);border-bottom:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:11px 0;color:var(--hmu);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--amb)}
.card{margin:12px 16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
.hero{margin:16px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:6px 0 0;font-size:14px;color:var(--mu)}
.lg2{text-align:center;font-size:13px;color:var(--mu)}
.pick{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.rk{font-weight:800;color:var(--mu)}
.tm{min-width:0}
.tm b{display:block;font-size:15px;font-weight:800}
.tm small{color:var(--mu);font-size:12px}
.od{text-align:right}
.od b{display:block;font-size:15px;font-weight:800;color:var(--amb)}
.od small{color:var(--mu);font-size:12px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--amb)}
.acca{border:1px solid var(--amb);background:var(--s1)}
.acca .tot{font-size:26px;font-weight:800;color:var(--amb)}
.acca .joint{font-size:13px;color:var(--mu)}
.leg{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.leg:first-of-type{border-top:0}
.leg small{color:var(--mu);display:block;font-size:12px}
.leg b{white-space:nowrap;color:var(--amb)}
.adslot{min-height:60px;margin:12px 16px;display:flex;justify-content:center;align-items:center}
.adslot:empty{display:none}
.fine{margin:16px 16px 0;font-size:12px;color:var(--mu)}
</style><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/fix.css">
</head><body>
<div class="wrap">
<header class="top"><a class="logo" href="/"><img src="/logo.png" alt="Fixturio logo"><b>Fixturio</b></a><a href="/">All matches</a></header>
<nav class="tabs"><a href="/">Matches</a><a href="/picks.html">Top 15</a><a href="/basketball.html" class="on">Basketball</a><a href="/standings.html">Standings</a><a href="/news.html">News</a><a href="/video.html">Video</a><a href="/saved.html">Saved</a><a href="/tools.html">Tools</a><a href="/community.html">Community</a></nav>
<div class="adslot" id="ad-banner"></div>
<main id="app">
<div class="hero">
<h1>Basketball picks</h1>
<p class="lg2" id="meta">Loading…</p>
</div>
<div class="adslot" id="ad-native"></div>
<div class="card acca" id="acca-card" style="display:none">
<h3>Acca of the day</h3>
<div class="tot" id="acca-total"></div>
<div class="joint" id="acca-joint"></div>
<div id="acca-legs"></div>
</div>
<div class="card" id="picks-card">
<h3>Top 15</h3>
<p class="note" style="margin-top:0">The day's safest basketball calls, ranked by win chance.</p>
<div id="picks"></div>
</div>
<div class="card" id="all-card">
<h3>All today's priced games</h3>
<div id="all"></div>
</div>
<div class="bet-cta" data-banner="1"></div>
<p class="fine">Predictions are estimates based on bookmaker odds, not guarantees. 18+ only.</p>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function flag(c){return "\U0001F3C0";}
function row(p,i){
  return '<div class="pick"><div class="rk">'+(i+1)+'</div><div class="tm"><b>'+esc(p.match)+'</b><small>'+flag(p.country)+' '+esc(p.league)+(p.time?" · "+esc(p.time):"")+'</small><div class="bar"><i style="width:'+p.probability+'%"></i></div></div><div class="od"><b>@'+p.odd+'</b><small>'+p.probability+'%</small></div></div>';
}
fetch("/api/basketball",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  if(!d||!d.picks||!d.picks.length){
    $("meta").textContent="Basketball picks start once the data connection is live.";
    $("picks-card").innerHTML='<h3>Top 15</h3><p class="note" style="margin-top:0">No basketball data yet. The daily build fills this page once the basketball data key is connected.</p>';
    $("all-card").style.display="none";
    return;
  }
  $("meta").textContent="Today \u00b7 "+d.picks.length+" ranked picks";
  if(d.acca&&d.acca.legs&&d.acca.legs.length){
    $("acca-card").style.display="";
    $("acca-total").textContent="Total odds "+d.acca.total;
    $("acca-joint").textContent=d.acca.joint+"% chance every leg lands";
    $("acca-legs").innerHTML=d.acca.legs.map(l=>'<div class="leg"><div><b style="color:var(--tx);font-size:14px">'+esc(l.match)+'</b><small>'+esc(l.market)+" \u00b7 "+esc(l.league)+(l.time?" \u00b7 "+esc(l.time):"")+'</small></div><b>@'+l.odd+'</b></div>').join("");
  }
  $("picks").innerHTML=d.picks.map(row).join("");
  const all=d.m||[];
  if(all.length)$("all").innerHTML=all.map((p,i)=>row(p,i)).join("");
}).catch(()=>{
  $("meta").textContent="Could not load basketball picks. Try again shortly.";
});
</script>
<script src="/affiliate.js" defer></script>
<script src="/auth.js"></script><script src="/ads.js" defer></script>
</body></html>
