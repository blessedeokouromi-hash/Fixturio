<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync debug</title><style>body{font:14px/1.5 monospace;margin:12px;white-space:pre-wrap}</style></head>
<body><pre id="out">booting…</pre>
<script src="/auth.js"></script>
<script>
const out=document.getElementById("out");
const lines=[];
function p(s){lines.push(s);out.textContent=lines.join("\n");}
(async function(){
  try{
    p("fxAuth present: "+(!!window.fxAuth));
    await fxAuth.ready();
    p("ready done, enabled="+fxAuth.enabled());
    const u=fxAuth.user();
    p("user="+(u?u.email:"null"));
    const a=await fxAuth.pull();
    p("A_pull="+JSON.stringify(a));
    const tok=await fxAuth.token();
    p("token="+(tok?tok.slice(0,12)+"…(len "+tok.length+")":"null"));
    const cfg=await (await fetch("/auth-config.json")).json();
    p("cfg_url="+cfg.url);
    if(tok){
      const r=await fetch(cfg.url+"/auth/v1/user",{headers:{apikey:cfg.key,Authorization:"Bearer "+tok}});
      const j=await r.json();
      p("C_GET_user_status="+r.status);
      p("C_metadata="+JSON.stringify(j.user_metadata!==undefined?j.user_metadata:j));
      const r2=await fetch(cfg.url+"/auth/v1/user",{method:"PUT",headers:{apikey:cfg.key,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({data:{fx_saves:[1649497]}})});
      const j2=await r2.json();
      p("D_PUT_status="+r2.status+" body="+JSON.stringify(j2).slice(0,300));
      const r3=await fetch(cfg.url+"/auth/v1/user",{headers:{apikey:cfg.key,Authorization:"Bearer "+tok}});
      const j3=await r3.json();
      p("E_metadata_after="+JSON.stringify(j3.user_metadata!==undefined?j3.user_metadata:j3));
      const b=await fxAuth.pull();
      p("F_fxAuth_pull_after="+JSON.stringify(b));
    }
    p("DONE");
  }catch(e){p("ERR "+(e&&e.message||e));}
})();
</script></body></html>
