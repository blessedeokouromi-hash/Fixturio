<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync clear</title></head><body><pre id="o">starting...</pre><script src="/auth-config.json"></script><script src="/auth.js"></script><script>
window.onerror=function(m){document.getElementById('o').textContent+=' | ERR '+m;return false;};
(function(){
  var o=document.getElementById('o');
  var say=function(s){o.textContent+='\n'+s;};
  say('step0: fxAuth='+typeof fxAuth);
  try{localStorage.removeItem('fixturio:saved');say('step1: local cleared');}catch(e){say('step1 err '+e);}
  var done=false;
  try{
    fxAuth.ready(function(){done=true;say('step2: ready fired');run();});
  }catch(e){say('step2 err '+e);}
  setTimeout(function(){ if(!done) say('TIMEOUT: ready never fired'); },12000);
  async function run(){
    try{
      var t=await fxAuth.token();
      say('step3: token='+(t?('yes len '+t.length):'null'));
      if(!t) return;
      var url='https://ncpquoviqczrxupiihvv.supabase.co/auth/v1/user';
      var res=await fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+t,'apikey':'sb_publishable_VHgrTvVRHEXMnltKq7at6A_jEd1D-P5','Content-Type':'application/json'},body:JSON.stringify({data:{fx_saves:[]}})});
      var txt=await res.text();
      say('step4: PUT status='+res.status+' body='+txt.slice(0,200));
      var res2=await fetch(url,{headers:{'Authorization':'Bearer '+t,'apikey':'sb_publishable_VHgrTvVRHEXMnltKq7at6A_jEd1D-P5'}});
      var j=await res2.json();
      say('step5: READ fx_saves='+JSON.stringify((j.user_metadata||{}).fx_saves));
    }catch(e){say('run err '+e);}
  }
})();
</script></body></html>
