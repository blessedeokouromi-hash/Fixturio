<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sync clear</title></head><body><pre id="o">starting...</pre><script>
(function(){
  var o=document.getElementById('o');
  var say=function(s){o.textContent+='\n'+s;};
  var found=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('sb-')===0)found.push(k);}
  say('sb keys: '+found.join(','));
  var tok=null;
  found.forEach(function(k){
    try{
      var v=JSON.parse(localStorage.getItem(k));
      var t=v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)||(v.user&&v.access_token));
      say('key '+k+' shape '+(v?Object.keys(v).join('|'):'null')+' tok='+(t?'yes':'no'));
      if(t&&!tok)tok=t;
    }catch(e){say('key '+k+' parse err '+e);}
  });
  if(!tok){say('NO TOKEN');return;}
  var url='https://ncpquoviqczrxupiihvv.supabase.co/auth/v1/user';
  fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+tok,'apikey':'sb_publishable_VHgrTvVRHEXMnltKq7at6A_jEd1D-P5','Content-Type':'application/json'},body:JSON.stringify({data:{fx_saves:[]}})})
  .then(function(r){say('PUT status='+r.status);return r.text();})
  .then(function(txt){say('body='+txt.slice(0,200));return fetch(url,{headers:{'Authorization':'Bearer '+tok,'apikey':'sb_publishable_VHgrTvVRHEXMnltKq7at6A_jEd1D-P5'}});})
  .then(function(r){return r.json();})
  .then(function(j){say('READ fx_saves='+JSON.stringify((j.user_metadata||{}).fx_saves));})
  .catch(function(e){say('ERR '+e);});
})();
</script></body></html>
