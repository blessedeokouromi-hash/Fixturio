<!DOCTYPE html>
<html lang="en"><head><script src="/adgate.js" async data-cfasync="false"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5A3C">
<meta name="robots" content="noindex">
<title>Team | Fixturio</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:500 15px/1.4 var(--f);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:4;background:var(--pitch);border-bottom:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:32px;height:32px;flex:none}
.logo b{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em}
.top>a{color:var(--hmu);text-decoration:none;font-weight:700}
.tabs{display:flex;align-items:center;gap:22px;padding:0 16px;background:var(--pitch);border-bottom:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:11px 0;color:var(--hmu);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--amb)}

.tabs span{margin-left:auto;font-size:12px;color:var(--hmu)}
.hero{margin:16px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--s1);display:flex;gap:14px;align-items:center}
.hero img{width:56px;height:56px;object-fit:contain}
.hero b{display:block;font-size:20px;font-weight:800}
.hero small{color:var(--mu);font-size:13px}
.rec{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rec span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.rec .W{background:#12351F;border-color:#2A6A44;color:#8CE6B0}
.rec .L{background:#3A1A1E;border-color:#7A2F38;color:#FF9AA4}
.rows{background:var(--s1);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .st{font-size:13px;font-weight:700;color:var(--mu);text-align:center}
.row .st.live{color:var(--live)}
.row .n{min-width:0}
.row .n div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .n small{color:var(--mu);font-size:12px}
.row .sc{font-weight:800;white-space:nowrap}
.msg{margin:24px 16px;color:var(--mu)}
.fine{margin:16px 16px 0;font-size:12px;color:var(--mu)}
.adslot{min-height:60px;margin:12px 16px;display:flex;justify-content:center;align-items:center}
.adslot:empty{display:none}
h3.sec{margin:20px 16px 8px;font-size:15px;font-weight:800}
</style><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/fix.css">
</head><body>
<div class="wrap">
<header class="top"><a class="logo" href="/"><img src="/logo.png" alt="Fixturio logo" style="width:32px;height:32px;flex:none;border-radius:8px"><b>Fixturio</b></a><a href="/">All matches</a></header>
<nav class="tabs tabsx"><a href="/">Matches</a><a href="/picks.html">Top 15</a><a href="/standings.html">Standings</a><a href="/news.html">News</a><a href="/video.html">Video</a><a href="/saved.html">Saved</a><a href="/tools.html">Tools</a><span id="upd"></span></nav>
<main id="app"><p class="msg">Loading team…</p></main>
<p class="fine">Results cover the last three days we store plus the next two. Full season fixtures come in the next update.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LIVE=["1H","2H","HT","ET","BT","P","LIVE"],DONE=["FT","AET","PEN"];
const tid=+new URLSearchParams(location.search).get("id");
const tname=new URLSearchParams(location.search).get("n")||"";
let found=[],league=null,logo="";
const tm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const dayLbl=o=>new Date(Date.now()+o*864e5).toLocaleDateString([],{weekday:"short"});
function stTxt(m){const s=m.fixture.status.short;if(s==="HT")return "HT";if(LIVE.includes(s))return (m.fixture.status.elapsed||"")+"′";if(s==="NS")return tm(m.fixture.date);return s;}
function render(){
  if(!found.length){$("app").innerHTML='<p class="msg">No matches found for this team in the current coverage window.</p>';return;}
  document.title=tname+" | Fixturio";
  let w=0,d=0,l=0,gf=0,ga=0;
  found.forEach(m=>{const me=m.goals.home>m.goals.away?(m.teams.home.id===tid?"W":"L"):m.goals.home<m.goals.away?(m.teams.away.id===tid?"W":"L"):"D";const gh=m.goals.home,ga2=m.goals.away;if(DONE.includes(m.fixture.status.short)){const own=me==="W"?1:me==="L"?-1:0;if(own>0)w++;else if(own<0)l++;else d++;gf+=m.teams.home.id===tid?gh:ga2;ga+=m.teams.home.id===tid?ga2:gh;}});
  let h='<div class="hero">'+(logo?'<img src="'+esc(logo)+'" alt="">':"")+"<div><b>"+esc(tname)+'</b><small>'+(league?esc(league.name)+" · "+esc(league.country):"")+"</small>";
  h+='<div class="rec"><span>'+w+'W</span><span>'+d+'D</span><span>'+l+'L</span><span>'+gf+':'+ga+' goals</span></div></div></div>';
  if(league)h+='<div style="margin:0 16px"><a href="/standings.html?league='+league.id+'" style="color:var(--amb);font-weight:700;font-size:14px;text-decoration:none">See '+esc(league.name)+' table</a></div>';
  h+='<h3 class="sec">Fixtures &amp; results</h3><div class="rows">';
  found.forEach((m,i)=>{
    const lbl=i===0?"":(dayLbl(0));
    const dl=Number(m.dayOff);
    h+='<a class="row" href="/match.html?id='+m.fixture.id+'"><div class="st'+(LIVE.includes(m.fixture.status.short)?" live":"")+'">'+(m.dayLbl||"")+'<br>'+esc(stTxt(m))+'</div><div class="n"><div>'+esc(m.opponent)+'</div><small>'+esc(m.league.name)+" · "+esc(m.league.country)+" · "+(m.home?"Home":"Away")+'</small></div><div class="sc">'+(m.goals.home===null?"":(m.home?m.goals.home+" – "+m.goals.away:m.goals.away+" – "+m.goals.home))+"</div></a>";
  });
  h+='</div>';
  $("app").innerHTML=h;
}
function collect(){
  const offs=["-1","0","1"];
  let i=0;
  function next(){
    if(i>=offs.length){render();return;}
    const off=offs[i++];
    fetch("/api/matches?date="+off).then(r=>r.json()).then(d=>{
      (d.response||[]).forEach(m=>{
        let opp=null,home=false;
        if(m.teams.home.id===tid){opp=m.teams.away.name;home=true;logo=logo||m.teams.home.logo;}
        else if(m.teams.away.id===tid){opp=m.teams.home.name;logo=logo||m.teams.away.logo;}
        if(opp){m.opponent=opp;m.home=home;m.dayOff=off;m.dayLbl=off==="0"?"Today":off==="-1"?"Yesterday":"Tomorrow";found.push(m);league=league||m.league;}
      });
      next();
    }).catch(()=>next());
  }
  next();
}
if(tid){collect();}else{$("app").innerHTML='<p class="msg">No team selected.</p>';}
</script>

</body></html>
